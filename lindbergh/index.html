const DRAW_O = 7500;          // outline phase
const DRAW = 16000;           // outline + shading phases
const HOLD = 3200, FADE = 1200, GAP = 600;
const CYCLE = DRAW + HOLD + FADE + GAP;

const STYLE = {
  o:  { color: "#26211a", op: 0.92 },
  f:  { color: "#201a13", op: 0.95 },
  h1: { color: "#4a4034", w: 1.5, op: 0.34 },
  h2: { color: "#3f362b", w: 1.7, op: 0.44 },
  h3: { color: "#332b22", w: 1.8, op: 0.52 },
  h4: { color: "#2a2118", w: 2.1, op: 0.62 },
  g1: { color: "#4a4034", w: 1.05, op: 0.22 },
  g2: { color: "#443a2f", w: 1.1, op: 0.28 },
  g3: { color: "#3f362b", w: 1.2, op: 0.34 },
  g4: { color: "#383026", w: 1.3, op: 0.40 },
  g5: { color: "#2f2820", w: 1.4, op: 0.47 },
  g6: { color: "#241d15", w: 1.55, op: 0.55 }
};

const svgNS = "http://www.w3.org/2000/svg";
const group = document.getElementById("strokes");
const pencil = document.getElementById("pencil");
const caption = document.getElementById("caption");
const artwrap = document.getElementById("artwrap");

const meta = STROKES.map(([d, k], i) => {
  const p = document.createElementNS(svgNS, "path");
  p.setAttribute("d", d);
  group.appendChild(p);
  const L = p.getTotalLength();
  const j = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1;
  const st = STYLE[k];
  const width = k === "o"
    ? (L >= 300 ? 3.1 : L >= 90 ? 2.5 : 2.0) + j * 0.5
    : k === "f"
    ? 2.5 + j * 0.4
    : st.w + j * 0.3;
  p.style.stroke = st.color;
  p.style.strokeWidth = width;
  p.style.strokeOpacity = Math.min(1, st.op + j * 0.08);
  p.style.strokeDasharray = L + " " + L;
  return { p, k, L };
});

// Schedule: outlines + face pen work fill [0, DRAW_O), hatches fill [DRAW_O, DRAW).
const outl = meta.filter(m => m.k === "o" || m.k === "f");
const hats = meta.filter(m => m.k !== "o" && m.k !== "f");
function schedule(list, t0, t1, weight) {
  const tw = list.reduce((s, m) => s + weight(m), 0);
  let acc = 0;
  for (const m of list) {
    m.start = t0 + acc / tw * (t1 - t0);
    acc += weight(m);
    m.end = t0 + acc / tw * (t1 - t0);
  }
}
schedule(outl, 0, DRAW_O - 120, m => Math.pow(m.L, 0.9) + (m.k === "f" ? 130 : 55));
schedule(hats, DRAW_O, DRAW, m => m.L + 40);

function resetAll() { for (const m of meta) m.p.style.strokeDashoffset = m.L; }
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

let ptr = 0, lastT = -1;
function render(t) {
  if (t < lastT) { resetAll(); ptr = 0; }
  lastT = t;

  let op = 1;
  if (t >= DRAW + HOLD) op = t >= DRAW + HOLD + FADE ? 0 : 1 - ease((t - DRAW - HOLD) / FADE);
  artwrap.style.opacity = op;
  caption.style.opacity = t >= DRAW ? ease((t - DRAW) / 500) : 0;

  while (ptr < meta.length && meta[ptr].end <= t) {
    meta[ptr].p.style.strokeDashoffset = 0;
    ptr++;
  }

  if (t < DRAW && ptr < meta.length) {
    const m = meta[ptr];
    const prog = Math.max(0, (t - m.start) / (m.end - m.start));
    const drawn = Math.min(m.L, m.L * prog);
    m.p.style.strokeDashoffset = m.L - drawn;
    const pt = m.p.getPointAtLength(drawn);
    pencil.setAttribute("transform", `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`);
    pencil.style.visibility = "visible";
  } else {
    pencil.style.visibility = "hidden";
  }
}

const params = new URLSearchParams(location.search);
const seek = parseFloat(params.get("t") || "0") * 1000;
const freeze = params.has("freeze");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

resetAll();

if (reduced) {
  for (const m of meta) m.p.style.strokeDashoffset = 0;
  caption.style.opacity = 1;
} else if (freeze) {
  render(Math.min(seek, CYCLE - 1) % CYCLE);
} else {
  let t0 = performance.now() - seek;
  let paused = false, pausedAt = 0;
  document.getElementById("page").addEventListener("click", () => {
    paused = !paused;
    if (paused) pausedAt = performance.now();
    else t0 += performance.now() - pausedAt;
  });
  (function tick(now) {
    if (!paused) render((now - t0) % CYCLE);
    requestAnimationFrame(tick);
  })(performance.now());
}
